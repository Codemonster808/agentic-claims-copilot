name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      ministack:
        image: ministackorg/ministack:latest
        ports: ["4566:4566"]
    env:
      VECTOR_BACKEND: chroma
      LLM_PROVIDER: fake
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/bootstrap.py
      - run: pytest tests/ features/ -v --ignore=tests/data_quality --cov=src --cov-report=term --cov-report=xml --cov-fail-under=48
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pip-audit
      # PYSEC-2026-311 / CVE-2026-45830 / CVE-2026-45833 / CVE-2026-45831:
      # all four are in chromadb's HTTP server API (/api/v2/tenants/.../
      # collections) and its multi-tenant RBAC authorization provider. This
      # repo only ever constructs chromadb.PersistentClient (src/utils/vectors.py)
      # — embedded, in-process, backed by a local .chroma/ directory, no HTTP
      # server, no network listener, no tenants/RBAC involved. None of the
      # vulnerable code paths are reachable. No fixed chromadb version exists
      # yet (1.5.9 is latest); re-run without --ignore-vuln periodically to
      # check.
      - run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-311 --ignore-vuln CVE-2026-45830 --ignore-vuln CVE-2026-45833 --ignore-vuln CVE-2026-45831

  e2e:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      ministack:
        image: ministackorg/ministack:latest
        ports: ["4566:4566"]
    env:
      VECTOR_BACKEND: chroma
      LLM_PROVIDER: fake
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/bootstrap.py
      - run: pytest tests/data_quality -v -s
      - uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            benchmarks/quality-report.json
            docs/quality-report.md
